<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Valhalla - HLA-4 Web Federate & Tactical Radar</title>
  <script src="../../dist/web/valhalla-hla.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0c1017; color: #d3c6aa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; display: flex; flex-direction: column; height: 100vh; }
    header { background: #141c26; border-bottom: 2px solid #233142; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.15rem; font-weight: bold; color: #7fbbb3; display: flex; align-items: center; gap: 8px; }
    .badge { background: #2b3b4f; color: #e5e9f0; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; }
    .badge-ok { background: #2e4a3d; color: #a7c080; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .panel { width: 380px; background: #0f141c; border-right: 1px solid #1f2a37; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .card { background: #141c26; border: 1px solid #233142; border-radius: 6px; padding: 12px; }
    .card h3 { font-size: 0.85rem; text-transform: uppercase; color: #a7c080; margin-bottom: 8px; }
    .btn { background: #2d4a3e; color: #a7c080; border: 1px solid #4a6f5d; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 4px; }
    .btn:hover { background: #395e4f; }
    .radar-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle at center, #101924 0%, #080c12 100%); }
    canvas { border-radius: 50%; box-shadow: 0 0 50px rgba(127, 187, 179, 0.2); background: #0a0f16; }
    .log-box { height: 180px; background: #090d12; border-top: 1px solid #1f2a37; padding: 8px 16px; overflow-y: auto; font-size: 0.75rem; }
    .log-line { margin-bottom: 2px; }
    .log-info { color: #7fbbb3; }
    .log-rx { color: #a7c080; }
    .log-warn { color: #dbbc7f; }
    .log-pass { color: #83c092; font-weight: bold; }
  </style>
</head>
<body>
<header>
  <div class="logo">
    <span>PROJECT VALHALLA</span>
    <span class="badge">IEEE 1516-2025 (HLA-4)</span>
    <span class="badge badge-ok">PURE BROWSER FEDERATE</span>
  </div>
  <div id="statusPill" style="font-size:0.8rem; color:#859289;">Disconnected</div>
</header>
<div class="main">
  <div class="panel">
    <div class="card">
      <h3>Homologation & Simulation</h3>
      <p style="font-size:0.75rem; color:#9da9a0; margin-bottom:8px;">
        Control live browser federate lifecycle and radar telemetry.
      </p>
      <button class="btn" id="runTestBtn" onclick="runHomologationTest()">Run 11-Stage Homologation Test</button>
      <button class="btn" id="patrolBtn" onclick="togglePatrol()" style="background:#26435c; color:#7fbbb3; border-color:#3a6185; margin-top:8px;">Start Continuous Air Patrol</button>
    </div>
    <div class="card">
      <h3>Active Federation</h3>
      <div style="font-size:0.8rem; display:flex; flex-direction:column; gap:4px;">
        <div>Federation: <b id="fedNameText" style="color:#7fbbb3;">-</b></div>
        <div>Federate Handle: <b id="fedHandleText" style="color:#7fbbb3;">-</b></div>
        <div>Tracked Objects: <b id="objCountText" style="color:#a7c080;">0</b></div>
        <div>Reflections Rx: <b id="reflectCountText" style="color:#a7c080;">0</b></div>
      </div>
    </div>
    <div class="card" style="flex:1;">
      <h3>Tracked Entities</h3>
      <div id="entityList" style="font-size:0.75rem; color:#859289;">No active entities</div>
    </div>
  </div>
  <div class="radar-box">
    <canvas id="radar" width="500" height="500"></canvas>
  </div>
</div>
<div class="log-box" id="logs"></div>

<script>
  const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
  const logBox = document.getElementById('logs');
  function log(msg, cls = 'log-info') {
    const d = document.createElement('div');
    d.className = 'log-line ' + cls;
    d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    logBox.appendChild(d);
    logBox.scrollTop = logBox.scrollHeight;
  }

  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d');
  const entities = {};
  let sweep = 0;
  let reflectTotal = 0;

  function renderRadar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const r = cx - 12;

    // Background circle
    ctx.fillStyle = '#080d14';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // Range Rings
    ctx.strokeStyle = '#1b2938';
    ctx.lineWidth = 1.5;
    for (let i = 1; i <= 4; i++) {
      ctx.beginPath();
      ctx.arc(cx, cy, (r / 4) * i, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#3a5068';
      ctx.font = '9px monospace';
      ctx.fillText((i * 250) + 'm', cx + 4, cy - (r / 4) * i + 10);
    }

    // Crosshairs
    ctx.beginPath();
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.stroke();

    // Radar Sweep Beam with trailing gradient
    sweep = (sweep + 0.025) % (Math.PI * 2);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, sweep - 0.25, sweep);
    ctx.closePath();
    const beamGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    beamGrad.addColorStop(0, 'rgba(127, 187, 179, 0)');
    beamGrad.addColorStop(1, 'rgba(127, 187, 179, 0.25)');
    ctx.fillStyle = beamGrad;
    ctx.fill();
    ctx.restore();

    // Sweep Line
    ctx.strokeStyle = '#a7c080';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(sweep) * r, cy + Math.sin(sweep) * r);
    ctx.stroke();

    // Draw Entities (blips)
    for (const id in entities) {
      const e = entities[id];
      const ex = cx + ((e.x - 500) / 500) * (r * 0.85);
      const ey = cy + ((e.y - 500) / 500) * (r * 0.85);

      // Blip pulse aura
      ctx.fillStyle = 'rgba(167, 192, 128, 0.25)';
      ctx.beginPath();
      ctx.arc(ex, ey, 10 + Math.sin(Date.now() / 150) * 2, 0, Math.PI * 2);
      ctx.fill();

      // Blip center core
      ctx.fillStyle = '#a7c080';
      ctx.beginPath();
      ctx.arc(ex, ey, 5, 0, Math.PI * 2);
      ctx.fill();

      // Label & coordinates
      ctx.fillStyle = '#e5e9f0';
      ctx.font = 'bold 11px monospace';
      ctx.fillText(e.name || ('Asset #' + id), ex + 9, ey - 2);

      ctx.fillStyle = '#7fbbb3';
      ctx.font = '9px monospace';
      ctx.fillText('(' + Math.round(e.x) + ',' + Math.round(e.y) + ')', ex + 9, ey + 10);
    }

    requestAnimationFrame(renderRadar);
  }
  requestAnimationFrame(renderRadar);

  // Ambassador
  const { RTIambassador, ResignAction } = window.ValhallaHLA;
  const rtiAmb = new RTIambassador("ws://127.0.0.1:52296/ws");

  rtiAmb.on('connected', () => {
    document.getElementById('statusPill').textContent = 'Online (ws://127.0.0.1:52296/ws)';
    document.getElementById('statusPill').style.color = '#a7c080';
    log('WebSocket connected successfully to Valhalla CRC!');
  });

  rtiAmb.on('discoverObjectInstance', (p) => {
    entities[p.object] = { x: 500, y: 500, name: p.name, class: p.class };
    log('DISCOVER: Object #' + p.object + ' (' + p.name + ') class=' + p.class, 'log-rx');
    updateEntitiesUI();
  });

  rtiAmb.on('reflectAttributeValues', (p) => {
    reflectTotal++;
    document.getElementById('reflectCountText').textContent = reflectTotal;
    if (!entities[p.object]) {
      entities[p.object] = { x: 500, y: 500, name: 'Track #' + p.object };
    }
    const pos = p.attributes['1001'] || Object.values(p.attributes)[0] || '';
    const match = pos.match(/x=([0-9.]+)[^y]+y=([0-9.]+)/) || pos.match(/([0-9.]+)[,\s]+([0-9.]+)/);
    if (match) {
      entities[p.object].x = parseFloat(match[1]);
      entities[p.object].y = parseFloat(match[2]);
    }
    log('REFLECT: Object #' + p.object + ' attrs=' + JSON.stringify(p.attributes), 'log-rx');
    updateEntitiesUI();
  });

  rtiAmb.on('removeObjectInstance', (p) => {
    delete entities[p.object];
    log('REMOVE: Object #' + p.object, 'log-warn');
    updateEntitiesUI();
  });

  function updateEntitiesUI() {
    const keys = Object.keys(entities);
    document.getElementById('objCountText').textContent = keys.length;
    const el = document.getElementById('entityList');
    el.textContent = '';
    if (keys.length === 0) {
      const span = document.createElement('span');
      span.style.color = '#859289';
      span.textContent = 'No active entities';
      el.appendChild(span);
      return;
    }
    keys.forEach(k => {
      const div = document.createElement('div');
      div.style.color = '#7fbbb3';
      div.appendChild(document.createTextNode('* [' + k + '] '));
      const b = document.createElement('b');
      b.textContent = String(entities[k].name);
      div.appendChild(b);
      div.appendChild(document.createTextNode(' (' + Math.round(entities[k].x) + ',' + Math.round(entities[k].y) + ')'));
      el.appendChild(div);
    });
  }

  // Connect automatically on page load
  rtiAmb.connect().catch(e => {
    log('Connection failed: ' + e.message, 'log-warn');
  });

  let patrolInterval = null;
  let patrolObjHandle = null;
  let patrolAngle = 0;

  async function togglePatrol() {
    const btn = document.getElementById('patrolBtn');
    if (patrolInterval) {
      clearInterval(patrolInterval);
      patrolInterval = null;
      btn.textContent = 'Start Continuous Air Patrol';
      btn.style.background = '#26435c';
      if (patrolObjHandle) {
        try {
          await rtiAmb.deleteObjectInstance(patrolObjHandle, "PatrolStopped");
          delete entities[patrolObjHandle];
          updateEntitiesUI();
          log("Patrol UAV deactivated.");
        } catch (e) {
          log("Warning deleting patrol UAV: " + e.message, "log-warn");
        }
        patrolObjHandle = null;
      }
      return;
    }

    try {
      btn.textContent = 'Starting Patrol...';
      await rtiAmb.connect();
      const fedName = "ValhallaHomologFederation";
      try { await rtiAmb.createFederationExecution(fedName, ["foms/ValhallaAdvanced.xml"]); } catch (e) {
        log("Federation create notice: " + e.message, "log-warn");
      }
      await rtiAmb.joinFederationExecution("WebPatrolFederate", fedName);

      const entityClass = await rtiAmb.getObjectClassHandle("TacticalEntity");
      const posAttr = await rtiAmb.getAttributeHandle(entityClass, "Position");
      const velAttr = await rtiAmb.getAttributeHandle(entityClass, "Velocity");
      await rtiAmb.publishObjectClassAttributes(entityClass, [posAttr, velAttr]);

      const dimX = await rtiAmb.getDimensionHandle("DimensionX");
      const dimY = await rtiAmb.getDimensionHandle("DimensionY");
      const dimZ = await rtiAmb.getDimensionHandle("DimensionZ");
      const regHandle = await rtiAmb.createRegion([dimX, dimY, dimZ]);
      await rtiAmb.setMetricBounds(regHandle, 0.0, 1000.0, 0.0, 1000.0, 0.0, 1000.0);
      await rtiAmb.subscribeObjectClassAttributesWithRegions(entityClass, [posAttr, velAttr], regHandle);

      patrolObjHandle = await rtiAmb.registerObjectInstance(entityClass, "Valhalla_Patrol_UAV");
      entities[patrolObjHandle] = { x: 500, y: 500, name: "Valhalla_Patrol_UAV", class: entityClass };
      updateEntitiesUI();
      log("Continuous Air Patrol activated! Target orbiting on live radar...", "log-pass");

      btn.textContent = 'Stop Air Patrol';
      btn.style.background = '#7a3b3b';

      patrolInterval = setInterval(async () => {
        patrolAngle += 0.04;
        const px = Math.round(500 + 300 * Math.cos(patrolAngle));
        const py = Math.round(500 + 300 * Math.sin(patrolAngle));
        if (entities[patrolObjHandle]) {
          entities[patrolObjHandle].x = px;
          entities[patrolObjHandle].y = py;
          updateEntitiesUI();
        }

        try {
          await rtiAmb.updateAttributeValuesSpatial(patrolObjHandle, {
            [posAttr]: `POS(x=${px}.0, y=${py}.0, z=200.0)`,
            [velAttr]: "VEL(mach=2.2)"
          }, px, py, 200.0, "Patrol");
        } catch (e) {
          log("Warning deleting patrol UAV: " + e.message, "log-warn");
        }
      }, 100);

    } catch (err) {
      log("Failed to start patrol: " + err.message, "log-warn");
      btn.textContent = 'Start Continuous Air Patrol';
      btn.style.background = '#26435c';
    }
  }

  async function runHomologationTest() {
    const btn = document.getElementById('runTestBtn');
    btn.disabled = true;

    try {
      log("====================================================================");
      log("   PROJECT VALHALLA - OFFICIAL IEEE 1516e WEB HOMOLOGATION TEST");
      log("====================================================================");

      // Stage 1: Connect
      log("[Stage 1/11] Initializing and Connecting to Valhalla CRC...");
      await rtiAmb.connect();
      log("  [+] Connected to CRC via WebSocket!");
      await sleep(300);

      // Stage 2: Create & Join
      const fedName = "ValhallaHomologFederation";
      log("[Stage 2/11] Creating & Joining Federation '" + fedName + "'...");
      try {
        await rtiAmb.createFederationExecution(fedName, ["foms/ValhallaAdvanced.xml"]);
        log("  [+] Federation created with FOM!");
      } catch (e) {
        log("  [*] Federation already exists, proceeding to join.");
      }

      const fedHandle = await rtiAmb.joinFederationExecution("WebTacticalFederate", fedName);
      document.getElementById('fedNameText').textContent = fedName;
      document.getElementById('fedHandleText').textContent = fedHandle;
      log("  [+] Joined federation! FederateHandle: " + fedHandle);
      await sleep(300);

      // Stage 3: Dynamic FOM Resolution
      log("[Stage 3/11] Resolving Object Class & Attributes from FOM...");
      const entityClass = await rtiAmb.getObjectClassHandle("TacticalEntity");
      const posAttr = await rtiAmb.getAttributeHandle(entityClass, "Position");
      const velAttr = await rtiAmb.getAttributeHandle(entityClass, "Velocity");
      const payloadAttr = await rtiAmb.getAttributeHandle(entityClass, "PayloadStatus");
      log("  [+] Resolved Class 'TacticalEntity' => " + entityClass);
      log("  [+] Resolved Attributes: Pos=" + posAttr + ", Vel=" + velAttr + ", Payload=" + payloadAttr);

      await rtiAmb.publishObjectClassAttributes(entityClass, [posAttr, velAttr, payloadAttr]);
      log("  [+] Published FOM attributes!");
      await sleep(300);

      // Stage 4: Dynamic DDM 3D Spatial Region
      log("[Stage 4/11] Resolving DDM Dimensions & Creating 3D Region...");
      const dimX = await rtiAmb.getDimensionHandle("DimensionX");
      const dimY = await rtiAmb.getDimensionHandle("DimensionY");
      const dimZ = await rtiAmb.getDimensionHandle("DimensionZ");
      log("  [+] Resolved Dimensions: X=" + dimX + ", Y=" + dimY + ", Z=" + dimZ);

      const regHandle = await rtiAmb.createRegion([dimX, dimY, dimZ]);
      await rtiAmb.setMetricBounds(regHandle, 0.0, 1000.0, 0.0, 1000.0, 0.0, 1000.0);
      await rtiAmb.subscribeObjectClassAttributesWithRegions(entityClass, [posAttr, velAttr, payloadAttr], regHandle);
      log("  [+] Subscribed with 3D Morton region " + regHandle + " bounding [0, 1000]^3!");
      await sleep(300);

      // Stage 5: Register Object Instance
      const assetName = "Valhalla_Web_Drone_01";
      log("[Stage 5/11] Registering object instance '" + assetName + "'...");
      const objHandle = await rtiAmb.registerObjectInstance(entityClass, assetName);
      log("  [+] Object instance registered! Handle: " + objHandle);

      // Add to local radar display immediately!
      entities[objHandle] = { x: 220, y: 220, name: assetName, class: entityClass };
      updateEntitiesUI();
      await sleep(500);

      // Stage 6: 3D Spatial Attribute Updates with visible radar flight path!
      log("[Stage 6/11] Performing 3D Spatial Attribute Updates with Live Flight Path...");
      const waypoints = [
        { x: 300, y: 280 },
        { x: 420, y: 380 },
        { x: 550, y: 450 },
        { x: 680, y: 350 },
        { x: 750, y: 240 }
      ];

      for (let i = 0; i < waypoints.length; i++) {
        const wp = waypoints[i];
        entities[objHandle].x = wp.x;
        entities[objHandle].y = wp.y;
        updateEntitiesUI();

        await rtiAmb.updateAttributeValuesSpatial(objHandle, {
          [posAttr]: `POS(x=${wp.x}.0, y=${wp.y}.0, z=150.0)`,
          [velAttr]: "VEL(mach=1.8)",
          [payloadAttr]: "WEB_SEARCH_ACTIVE"
        }, wp.x, wp.y, 150.0, "WebCycle_" + (i + 1));

        log(`  [+] Sent spatial waypoint ${i + 1}/5 at (${wp.x}, ${wp.y}, 150) - Live Radar Tracked!`);
        await sleep(400);
      }

      // Stage 7: Ownership Management
      log("[Stage 7/11] Testing Attribute Ownership Management on 'Position'...");
      const initialOwner = await rtiAmb.isAttributeOwnedByFederate(objHandle, posAttr);
      log("  [+] Initial Ownership: " + initialOwner + " (expected: true)");
      if (!initialOwner) throw new Error("Stage 7 failed: expected initial ownership to be true");

      await rtiAmb.unconditionalAttributeOwnershipDivestiture(objHandle, [posAttr]);
      const afterDivest = await rtiAmb.isAttributeOwnedByFederate(objHandle, posAttr);
      log("  [+] Ownership after divestiture: " + afterDivest + " (expected: false)");
      if (afterDivest) throw new Error("Stage 7 failed: expected ownership after divestiture to be false");

      await rtiAmb.attributeOwnershipAcquisition(objHandle, [posAttr], "WebAcquireTag");
      const afterAcquire = await rtiAmb.isAttributeOwnedByFederate(objHandle, posAttr);
      log("  [+] Ownership after re-acquisition: " + afterAcquire + " (expected: true)");
      if (!afterAcquire) throw new Error("Stage 7 failed: expected ownership after re-acquisition to be true");
      await sleep(600);

      // Stage 8: Delete Object Instance
      log("[Stage 8/11] Deleting object instance " + objHandle + "...");
      await rtiAmb.deleteObjectInstance(objHandle, "WebHomologDone");
      delete entities[objHandle];
      updateEntitiesUI();
      log("  [+] Object deleted cleanly!");
      await sleep(400);

      // Stage 9: Resign
      log("[Stage 9/11] Resigning federation execution...");
      await rtiAmb.resignFederationExecution(ResignAction.DELETE_OBJECTS_THEN_DIVEST);
      log("  [+] Resigned successfully!");

      // Stage 10: Destroy
      log("[Stage 10/11] Destroying federation execution...");
      try {
        await rtiAmb.destroyFederationExecution(fedName);
        log("  [+] Federation execution destroyed!");
      } catch (e) {
        if (!e.message || !e.message.includes("FederatesCurrentlyJoined")) {
          throw e;
        }
        log("  [*] Federation still has other joined federates: " + e.message);
      }

      // Stage 11: Disconnect
      log("[Stage 11/11] Disconnecting...");
      await rtiAmb.disconnect();
      log("  [+] Disconnected cleanly from CRC!");

      log("====================================================================", "log-pass");
      log("   HOMOLOGATION TEST PASSED: ALL 11 VERIFICATION STAGES SUCCEEDED   ", "log-pass");
      log("====================================================================", "log-pass");

    } catch (err) {
      log("[-] TEST FAILED: " + err.message, "log-warn");
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
