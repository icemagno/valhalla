<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradientes Laranja e Verde -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C33" />
      <stop offset="50%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>

    <linearGradient id="shieldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D3E" />
      <stop offset="50%" stop-color="#0E2F26" />
      <stop offset="100%" stop-color="#051813" />
    </linearGradient>

    <linearGradient id="arrowGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>

    <linearGradient id="arrowOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB40" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>

    <radialGradient id="bossShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="60%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#5D1B00" />
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00E676" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Sombra do Escudo -->
  <circle cx="250" cy="250" r="215" fill="none" filter="url(#dropShadow)" />

  <!-- Aro Externo Nórdico (Laranja reforçado) -->
  <circle cx="250" cy="250" r="215" fill="url(#shieldRim)" stroke="#2E7D32" stroke-width="6" />

  <!-- Rebites de Aço no Aro Externo -->
  <!-- 12 Rebites nos ângulos do relógio -->
  <circle cx="250" cy="45" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="352" cy="72" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="428" cy="148" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="455" cy="250" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="428" cy="352" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="352" cy="428" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="250" cy="455" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="148" cy="428" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="72" cy="352" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="45" cy="250" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="72" cy="148" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />
  <circle cx="148" cy="72" r="7" fill="#00E676" stroke="#051813" stroke-width="2" />

  <!-- Corpo Interno do Escudo (Verde Escuro Tático Nórdico com tábuas segmentadas) -->
  <circle cx="250" cy="250" r="190" fill="url(#shieldCore)" stroke="#FF8C33" stroke-width="4" />

  <!-- Linhas de Junção das Tábuas do Escudo -->
  <path d="M 100 100 L 100 400 M 175 60 L 175 440 M 250 60 L 250 440 M 325 60 L 325 440 M 400 100 L 400 400" 
        stroke="#0A221B" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Círculo de Runa Nórdica Interno -->
  <circle cx="250" cy="250" r="145" fill="none" stroke="#FF6D00" stroke-width="2" stroke-dasharray="8,6" opacity="0.6" />

  <!-- O Símbolo Central: Setas nas 4 Direções (Norte, Sul, Leste, Oeste) -->
  <g id="fourDirectionArrows" filter="url(#glowGreen)">
    <!-- Seta NORTE (Verde e Laranja) -->
    <path d="M 250 75 L 275 140 L 258 140 L 258 215 L 242 215 L 242 140 L 225 140 Z" fill="url(#arrowGreen)" stroke="#0E2F26" stroke-width="2" />
    
    <!-- Seta SUL (Verde e Laranja) -->
    <path d="M 250 425 L 275 360 L 258 360 L 258 285 L 242 285 L 242 360 L 225 360 Z" fill="url(#arrowGreen)" stroke="#0E2F26" stroke-width="2" />
    
    <!-- Seta LESTE (Laranja e Verde) -->
    <path d="M 425 250 L 360 225 L 360 242 L 285 242 L 285 258 L 360 258 L 360 275 Z" fill="url(#arrowOrange)" stroke="#3E1A00" stroke-width="2" />
    
    <!-- Seta OESTE (Laranja e Verde) -->
    <path d="M 75 250 L 140 225 L 140 242 L 215 242 L 215 258 L 140 258 L 140 275 Z" fill="url(#arrowOrange)" stroke="#3E1A00" stroke-width="2" />
  </g>

  <!-- Umbo Central (O Domo de Metal do Escudo Nórdico) -->
  <circle cx="250" cy="250" r="45" fill="url(#bossShine)" stroke="#00E676" stroke-width="4" filter="url(#dropShadow)" />
  <circle cx="250" cy="250" r="28" fill="#1B4D3E" stroke="#FFAB40" stroke-width="3" />

  <!-- Ponto Focal Central (Nexus da Federação) -->
  <circle cx="250" cy="250" r="10" fill="#00E676" />
</svg>
